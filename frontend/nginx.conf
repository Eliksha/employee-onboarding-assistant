# Same-origin setup: the browser calls /api/*, nginx forwards to the backend with /api stripped
# (identical to the Vite dev proxy), so no CORS is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; re-resolve "backend" so a restarted backend container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
