# Main nginx configuration for the OnboardAI frontend image (Alpine nginx package). The server block is rendered
# at start-up from deploy/azure/nginx.conf.template into /etc/nginx/http.d/default.conf.
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;
    include /etc/nginx/http.d/*.conf;
}
